repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # The vendored OpenMetadata JSON schemas are copied byte-for-byte from
      # upstream and re-downloaded verbatim by
      # scripts/update_openmetadata_fixtures.py --schemas. Whitespace fixups
      # would make the committed copy differ from the source it claims to be,
      # and would then fight the refresh script on every bump.
      - id: trailing-whitespace
        exclude: ^tests/adapters/openmetadata/schemas/.*\.json$
      - id: end-of-file-fixer
        exclude: ^tests/adapters/openmetadata/schemas/.*\.json$
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict

  # Pinned to the same Ruff the dev dependency group resolves, so the hook and
  # `uv run ruff format --check .` cannot disagree about a file — a contributor
  # following CONTRIBUTING.md must not meet two gates with two opinions.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy src
        language: system
        types: [python]
        pass_filenames: false
