[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dataswamp-biosystems"
version = "0.1.0"
description = "An open, entirely fictional synthetic oncology data estate and governance benchmark. No real patient data is used."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Ron Finn", email = "28505981+ronfinn@users.noreply.github.com" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.16",
    "pydantic[email]>=2.9",
    "pyyaml>=6.0.2",
    "numpy>=2.1",
    "pyarrow>=18.0",
    "pillow>=11.0",
    "tifffile>=2024.8.30",
    "anndata>=0.13",
]

[project.scripts]
dataswamp = "dataswamp_biosystems.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4",
    "types-pyyaml>=6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dataswamp_biosystems"]

# The canonical configuration and the example submissions ship *inside* the
# distribution, so `pip install dataswamp-biosystems` is enough to generate a
# benchmark — a source checkout is a contributor convenience, not a requirement.
# Both are copied verbatim from the tracked trees, so the packaged copy and the
# checkout copy generate identical bytes.
#
# ``DATA-LICENSE.md`` ships for the same reason: every bundle carries a verbatim
# copy of it, so an installed-only user must be able to build one without a
# checkout, and the copy must be the same bytes the repository tracks.
[tool.hatch.build.targets.wheel.force-include]
"config" = "dataswamp_biosystems/_config"
"examples/predictions" = "dataswamp_biosystems/_examples/predictions"
"DATA-LICENSE.md" = "dataswamp_biosystems/_licenses/DATA-LICENSE.md"

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "config",
    "examples",
    "tests",
    "docs",
    "scripts",
    "README.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "LICENSE",
    "DATA-LICENSE.md",
    "COMMERCIAL-LICENSING.md",
    "pyproject.toml",
    "uv.lock",
    ".pre-commit-config.yaml",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

# Scientific-file writer dependencies ship without type stubs / py.typed markers.
[[tool.mypy.overrides]]
module = ["pyarrow.*", "tifffile.*", "anndata.*", "PIL.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks slower tests (e.g. full demo-profile generation); deselect with -m 'not slow'",
]
